.map((m) => ({ ...m, pressed: m.id === mode ? 'true' : 'false', bg: m.id === mode ? '#16182B' : 'transparent', fg: m.id === mode ? '#FFFFFF' : '#16182B', pick: () => this.setState({ mode: m.id }) }));
return { xp, letters, modes, active, tag, body, lang: mode === 'quote' ? active.lang : 'es' };
}
}
window.Component = Component;
</script>
