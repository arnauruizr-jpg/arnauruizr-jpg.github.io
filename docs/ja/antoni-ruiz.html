<h1 style="margin: 0; font-weight: 800; font-size: clamp(44px, 6vw, 86px); line-height: .94; letter-spacing: -.04em">一冊の本と、 <span style="font-weight: 300; font-style: italic; color: #B4432F">その旅を伝える。</span></h1>

<p style="margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px 18px"><a href="#t-piezas" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700">制作物を見る ↓</a><a href="#t-mapa" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700">活動マップへ ↓</a></p>

<p style="margin: 16px 0 0; font-size: 18px; line-height: 1.65; color: #2C2F45">Learn2PF とともに、アントニ・ルイスの Instagram のコンテンツ、antoniruiz.com の更新、『Construyendo Caminos Duales』の広報を担当しました。ここで紹介する制作物はその一部で、地図はアントニの活動の背景を示しています。</p>
<blockquote lang="en" style="margin: 22px 0 0; font-weight: 300; font-style: italic; font-size: 22px; line-height: 1.4">“Beyond his technical skills, Arnau’s positive attitude and collaborative spirit made him a real pleasure to work with.”</blockquote>
<p style="margin: 8px 0 0; font-size: 14px; color: #6A6D82">アントニ・ルイス（Learn2PF CEO）。訳：「技術的なスキルだけでなく、アルナウの前向きな姿勢と協調性のおかげで、一緒に働くことが本当に楽しかったです。」</p>
