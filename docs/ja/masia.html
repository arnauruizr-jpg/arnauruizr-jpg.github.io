<p style="margin: 0 0 16px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #1F2A44">経験 · 東京・銀座</p>
<h1 style="margin: 0; font-weight: 800; font-size: clamp(44px, 6vw, 86px); line-height: .94; letter-spacing: -.04em">ホールで、 <span style="font-weight: 300; font-style: italic; color: #2A35D8">もうひとつの言葉で。</span></h1>
<p style="margin: 22px 0 0; max-width: 46ch; font-weight: 300; font-style: italic; font-size: 22px; line-height: 1.45">東京・銀座のカタルーニャ料理店 Masia でホールスタッフとして働きました。一つひとつのテーブルを担当することは、お店のコンセプトを伝えることでもありました。</p>
</div>
<a href="https://masia.jp/" aria-label="Masia のウェブサイト masia.jp を見る" style="flex: 2 1 320px; min-width: 0; aspect-ratio: 4 / 5; max-height: 460px; border-radius: 24px; background: #1F2A44; color: #F5EFE2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-decoration: none; padding: 26px; box-sizing: border-box">

<span style="font-weight: 800; font-size: 26px; letter-spacing: .12em">MASIA</span>
<span style="font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .75">Mar i Muntanya · 銀座</span>
<span style="margin-top: 12px; display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #F5EFE2; color: #1F2A44; font-weight: 800; font-size: 15px">masia.jp を見る ↗</span>

<section aria-label="3つのパートで" style="border-top: 2px solid #16182B">
<ol style="list-style: none; margin: 0; padding: 0">
<li style="display: flex; flex-wrap: wrap; gap: 14px 40px; padding: 32px 0; border-bottom: 1px solid rgba(22,24,43,.14)">
<p style="flex: 0 0 60px; margin: 0; font-weight: 800; font-size: 18px; color: #2A35D8">01</p>
<h2 style="flex: 1 1 240px; margin: 0; font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -.02em">レストラン</h2>
<p style="flex: 2 1 420px; margin: 0; font-size: 18px; line-height: 1.65; color: #2C2F45">ミシュランガイドに掲載された、銀座の高級カタルーニャ料理店。カタルーニャのルーツ、スペインの魂、日本の食材を「Mar i Muntanya」（海と山）というひとつのコンセプトで、一皿にまとめています。</p>
</li>
<li style="display: flex; flex-wrap: wrap; gap: 14px 40px; padding: 32px 0; border-bottom: 1px solid rgba(22,24,43,.14)">
<p style="flex: 0 0 60px; margin: 0; font-weight: 800; font-size: 18px; color: #2A35D8">02</p>
<h2 style="flex: 1 1 240px; margin: 0; font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -.02em">担当した <span style="font-weight: 300; font-style: italic">こと</span></h2>
<p style="flex: 2 1 420px; margin: 0; font-size: 18px; line-height: 1.65; color: #2C2F45">国際的なお客様を相手にホールで働き、テーブルを担当し、お店のコンセプトを説明しておすすめをしました。日本語を学びながら、チームとも日本語でやり取りしていました。</p>
</li>
<li style="display: flex; flex-wrap: wrap; gap: 14px 40px; padding: 32px 0; border-bottom: 1px solid rgba(22,24,43,.14)">
<p style="flex: 0 0 60px; margin: 0; font-weight: 800; font-size: 18px; color: #2A35D8">03</p>
<h2 style="flex: 1 1 240px; margin: 0; font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -.02em">担当した <span style="font-weight: 300; font-style: italic">学んだこと</span></h2>
<div style="flex: 2 1 420px; min-width: 0">
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #2C2F45">異なる文化の中での接客を通して、聞くこと、観察すること、伝え方を調整することを身につけました。</p>
<div style="margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px">
<span style="display: inline-flex; align-items: baseline; gap: 8px; padding: 12px 16px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(22,24,43,.08)"><span lang="ja" style="font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 22px">おもてなし</span><span style="font-size: 14px; color: #44475E">お客様の一歩先を読む</span></span>
<span style="display: inline-flex; align-items: baseline; gap: 8px; padding: 12px 16px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(22,24,43,.08)"><span lang="ja" style="font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 22px">改善</span><span style="font-size: 14px; color: #44475E">毎日少しずつ良くする</span></span>
</div>
</div>
</li>
</ol>

<section aria-label="推薦状" style="padding: 44px 0">
<blockquote lang="en" style="margin: 0; max-width: 30ch; font-weight: 300; font-style: italic; font-size: clamp(26px, 3vw, 40px); line-height: 1.3">“He maintains a positive attitude under pressure, consistently delivers excellent guest experiences, and responds to feedback with immediate and effective improvement.”</blockquote>
<p style="margin: 16px 0 0; font-size: 15px; color: #44475E"><strong>マテウ・ビジャレット</strong>、Masia シェフ兼オーナー。訳：「プレッシャーの中でも前向きな姿勢を保ち、常にお客様に素晴らしい体験を提供し、指摘にはすぐに的確な改善で応えてくれます。」</p>
