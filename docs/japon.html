renderVals() {
const masia = 'Cita literal de la carta de Mateu Villaret (Masia), original en inglés.';
const STORIES = [["Dejar lo conocido y empezar a encontrar mi sitio.", "Irme a Japón fue romper con la vida que tenía aquí y aprender a construir otra. No quería conocer el país solo desde fuera: quería trabajar, aprender el idioma y relacionarme con la gente que vivía allí. Una cosa era imaginar esa experiencia y otra empezar a desenvolverme en ella.", "Al llegar, muchas cosas que aquí hacía sin pensar requerían más atención. El idioma y las diferencias culturales estaban presentes en situaciones cotidianas y en la manera de comunicarme. Tenía que observar, preguntar y aceptar que no siempre iba a entenderlo todo a la primera.", "Esa fue una parte importante del cambio: darme tiempo para aprender sin esperar a tenerlo todo resuelto. Entre el trabajo, los trayectos y las conversaciones fui construyendo una vida que al principio me resultaba desconocida. Así fui conociendo Japón: viviendo allí."], ["Aprender un idioma que necesitaba cada día.", "El japonés dejó de ser solo algo que quería aprender y pasó a formar parte de mi día a día. Me ayudaba a desenvolverme en el trabajo, entender mejor lo que pasaba a mi alrededor y relacionarme con otras personas. Aprender el idioma y adaptarme a la vida allí iban de la mano.", "No se trataba únicamente de conocer palabras. También tenía que prestar atención a cómo se decían las cosas, al contexto y a las formas de dirigirse a los demás. A veces me equivocaba; intentaba entenderlo y volver a probar. Esa manera de aprender haciendo encaja mucho conmigo.", "Sigo considerando mi japonés básico y tengo mucho por aprender. Lo que valoro de aquella etapa es haberlo utilizado para acercarme a las personas y participar más en la vida de allí. La recomendación de Mateu recoge cómo fue viendo ese progreso en el trabajo."], ["Trabajar en Ginza, aprender también en sala.", "En Tokio trabajé en la sala de Masia, un restaurante catalán en Ginza. Mi trabajo era atender a los clientes y colaborar con el equipo en el servicio. Era un entorno distinto al que conocía, y tuve que adaptarme mientras seguía aprendiendo japonés.", "El trato con la gente siempre me ha gustado. Allí pude vivirlo desde otra cultura: escuchar, observar las expectativas de cada persona y encontrar la forma de comunicarme. El cuidado de los detalles y la coordinación con el equipo formaban parte del trabajo diario.", "Mi puesto allí fue de sala y atención al cliente. Lo que conecta esa experiencia con mi trabajo de ahora es la práctica de entender a las personas y ajustar la comunicación a cada situación. No todo ese aprendizaje vino del idioma; mucho llegó trabajando con otros y atendiendo a lo que ocurría a mi alrededor."], ["Cuando un lugar nuevo empieza a ser tu día a día.", "Vivir en Japón también fueron los trayectos, el trabajo y los momentos entre una cosa y otra. El metro que aparece en la foto forma parte de esa experiencia: desplazarme por una ciudad que al principio tenía que aprender a entender y que poco a poco se fue haciendo más cercana.", "Relacionarme con personas japonesas me permitió conocer la cultura desde una posición distinta a la de una visita. Fui entendiendo otras costumbres y formas de comunicación, y comparándolas con las que traía de aquí. Adaptarme no significaba hacerlo todo perfecto, sino estar dispuesto a escuchar y cambiar lo que hiciera falta.", "También hubo tiempo para conocer otros lugares. La imagen del río recuerda esa otra parte de la estancia, fuera del trabajo y de los trayectos habituales. Las dos cosas forman parte de lo que me llevo: aprender a vivir allí y disfrutar de descubrirlo."], ["También aprendí mirando cómo se comunica una ciudad.", "Después de estudiar marketing, me resultaba difícil no fijarme en cómo se presentaban las tiendas, los productos y los mensajes. En Japón esa curiosidad tenía un contexto nuevo. La fotografía de esta parada muestra una calle comercial donde los rótulos se reparten las fachadas y acompañan el recorrido de las personas.", "Me interesaba observar qué llamaba mi atención y qué necesitaba entender mejor por no conocer todavía el idioma o los códigos del lugar. La misma calle podía leerse de otra manera según lo familiar que me resultara lo que estaba viendo. Esa diferencia me hacía detenerme en cosas que aquí quizá habría pasado por alto.", "Esa curiosidad me ayudó a mirar la comunicación desde otro lugar. Es algo que tengo presente al preparar contenido: importa qué queremos contar, pero también a quién nos dirigimos y desde qué contexto lo va a interpretar. Vivir allí me hizo más consciente de todo lo que cambia cuando cambia la persona que recibe un mensaje."], ["Volver con otra forma de afrontar lo nuevo.", "Me llevé la experiencia de haber construido una vida en otro entorno: aprender un idioma, trabajar y relacionarme con personas de una cultura diferente. Japón no fue una etapa en la que lo entendiera todo; fue una etapa en la que tuve que estar dispuesto a aprender muchas cosas.", "Me representa esa forma de avanzar. Me adapto rápido, me gusta probar y, cuando me equivoco, intento entender qué puedo hacer mejor. Vivir allí me dio ocasiones reales para ponerlo en práctica, tanto en el trabajo como fuera de él.", "Hoy sigo aprendiendo, ahora desde el contenido y la gestión de comunidades. Me gusta proponer ideas y trabajarlas con el equipo, escuchar otros puntos de vista y dar forma a lo que queremos comunicar. Cambió el entorno, pero sigo reconociéndome en esa manera de hacer las cosas: implicarme, adaptarme y seguir aprendiendo por el camino."]];
const S = [
{ kanji: '到着', kana: 'とうちゃく', romaji: 'Tōchaku', es: 'Llegada', title: 'Llegar era solo el principio.',
text: 'Irme a Japón supuso dejar lo conocido y construir una vida en otro lugar. Quería aprender el idioma, trabajar y conocer a su gente. Una vez allí, tocó aprender a desenvolverme en el día a día.',
photos: [{ src: 'img/japon-noche.jpg', ratio: '3 / 5', pos: '100% 50%', alt: 'Arnau de noche en una calle, cargado con bolsas', cap: 'Durante mi etapa en Japón.' }] },
{ kanji: '日本語', kana: 'にほんご', romaji: 'Nihongo', es: 'Idioma', title: 'Aprender para poder formar parte.', genko: true,
text: 'Aprender japonés me ayudaba a desenvolverme en el trabajo, conocer gente y entender mejor lo que pasaba a mi alrededor. El idioma formaba parte de la experiencia de vivir allí y encontrar mi sitio.',
hasQuote: true, quote: '“One of his most notable achievements is his rapid progress in Japanese, which has enabled him to communicate effectively with colleagues, suppliers, and guests, making him an increasingly valuable member of our team.”',
quoteNote: masia + ' Traducción: «Uno de sus logros más destacados es su rápido progreso con el japonés, que le ha permitido comunicarse eficazmente con compañeros, proveedores y clientes, convirtiéndose en un miembro cada vez más valioso de nuestro equipo».', photos: [] },
{ kanji: '銀座', kana: 'ぎんざ', romaji: 'Ginza', es: 'Trabajo', title: 'Trabajar también fue aprender la cultura.',
text: 'En Masia, un restaurante catalán de Ginza, trabajé en sala mientras seguía aprendiendo japonés. El trabajo me acercó a otras expectativas sobre la atención al cliente y el cuidado de los detalles. Adaptarme también fue aprender a comunicarme con compañeros y clientes.',
noPhoto: true, photoPending: 'Masia · Ginza', masia: true,
hasQuote: true, quote: '“He quickly adapted to the demanding standards of fine dining and has shown continuous improvement and a strong willingness to learn.”',
quoteNote: masia + ' Traducción: «Se adaptó rápidamente a los exigentes estándares de la alta cocina y ha mostrado una mejora continua y muchas ganas de aprender».', photos: [] },
{ kanji: '日常', kana: 'にちじょう', romaji: 'Nichijō', es: 'Día a día', title: 'De conocer un lugar a vivir en él.',
text: 'Moverme por la ciudad, trabajar y relacionarme con personas japonesas fue convirtiendo un lugar nuevo en mi vida cotidiana. Adaptarme a sus costumbres también me hizo mirar de otra manera las mías.',
photos: [
{ src: 'img/japon-metro.jpg', ratio: '4 / 5', pos: '55% 50%', alt: 'Arnau en un vagón de metro mirando el móvil', cap: 'Un trayecto cotidiano.' },

photos: [{ src: 'img/viajes-fuji.jpg', ratio: '4 / 5', pos: '50% 60%', alt: 'El monte Fuji entre nubes, sobre una ciudad', cap: 'El Fuji, entre nubes.' }] }

const go = (k) => () => { const t = Math.max(0, Math.min(n - 1, k)); if (t !== i) { this.remember(t); this.setState({ i: t, moves: moves + 1 }); } };
const stations = S.map((s, k) => ({ ...s, code: 'AR ' + String(k + 1).padStart(2, '0'), current: k === i ? 'step' : 'false', dot: k === i ? '#1E2B4F' : '#FFFFFF', labelColor: k === i ? '#1E2B4F' : '#555B66', aria: 'Parada ' + (k + 1) + ': ' + s.es + (k === i ? ' (actual)' : ''), short: ['Llegada', 'Idioma', 'Trabajo', 'Día a día', 'Marcas', 'Me llevo'][k], pick: go(k) }));
const cur = { ...S[i], title: STORIES[i][0], paragraphs: STORIES[i].slice(1), num: String(i + 1).padStart(2, '0'), photos: S[i].photos || [], genko: !!S[i].genko, noPhoto: !!S[i].noPhoto, pendingText: !!S[i].pendingText, hasQuote: !!S[i].hasQuote, masia: !!S[i].masia, last: !!S[i].last };
const prev = S[i - 1], next = S[i + 1];
const genko = 'にほんごをまなぶまいにち'.split('').concat(['', '', '']).map((c) => ({ c }));
return {
stations, cur, genko,
even: moves > 0 && moves % 2 === 0, odd: moves % 2 === 1,
trainLeft: (n > 1 ? (i / (n - 1)) * 100 : 0) + '%',
goPrev: go(i - 1), goNext: go(i + 1), goFirst: go(0), notStart: i > 0,
atStart: i === 0, atEnd: i === n - 1, notEnd: i !== n - 1, curNumInt: i + 1,
prevOpacity: i === 0 ? 0.35 : 1, nextOpacity: i === n - 1 ? 0.35 : 1,
prevKanji: prev ? prev.kanji : '', prevRomaji: prev ? prev.romaji : 'Inicio',
nextKanji: next ? next.kanji : '', nextRomaji: next ? next.es : 'Continuar · Trabajos', nextEs: next ? next.es : 'Trabajos',
prevAria: prev ? 'Parada anterior: ' + prev.es : 'No hay parada anterior',
nextAria: next ? 'Parada siguiente: ' + next.es : 'No hay parada siguiente'
};
}
}
window.Component = Component;
</script>
