<script>
class Component extends DCLogic {

renderVals() {
const masia = 'Quoted verbatim from Mateu Villaret’s letter (Masia), original in English.';
const STORIES = [["Leaving the familiar and finding my place.", "Moving to Japan meant leaving the life I knew here and learning to build another one. I wanted to experience the country by working, learning the language and getting to know its people. Imagining that experience was one thing; learning to manage everyday life there was another.", "The language and cultural differences made ordinary situations require more attention. I had to observe, ask questions and accept that I would not understand everything straight away. Giving myself time to learn was part of finding my place.", "The photograph belongs to that everyday life: streets, journeys and things to carry from one place to another. That is how I got to know Japan: by living there."], ["Learning a language I needed every day.", "Japanese became part of everyday life. It helped me manage at work, understand what was happening around me and get to know people. Learning the language and adapting to life there went together.", "It was not just about words. I had to pay attention to context and to how people spoke to one another. I made mistakes, tried to understand them and tried again. Learning through practice suits me.", "I still describe my Japanese as basic. What I value is having used it to get closer to people and take part in life there. Mateu’s recommendation describes the progress he saw at work."], ["Working in Ginza, learning on the restaurant floor.", "In Tokyo I worked front of house at Masia, a Catalan restaurant in Ginza. My role involved looking after customers and working with the service team. I had to adapt to a new environment while continuing to learn Japanese.", "I have always enjoyed working with people. There I experienced it in another culture: listening, understanding expectations and finding ways to communicate. Attention to detail and coordination with colleagues were part of daily work.", "This was a hospitality role. Its connection to my work today is the experience of understanding people and adapting communication to the situation. Much of that learning came from working with others and observing what was happening around me."], ["When a new place becomes everyday life.", "Living in Japan also meant journeys, work and the moments in between. The metro photograph is part of that experience: getting around a city I first had to learn to understand and gradually came to know.", "Getting to know Japanese people helped me experience the culture beyond a visit. I encountered different habits and ways of communicating. Adapting meant being willing to listen and change, rather than getting everything right.", "There was also time to discover other places. The river photograph recalls that part of the stay, away from work and familiar journeys. Both belong to what I took home: learning to live there and enjoying discovering it."], ["Observing how a city communicates.", "Having studied marketing, I noticed how shops, products and messages were presented. In Japan that curiosity had a new context. This photograph shows a shopping street where signs share the building fronts and accompany people along the street.", "I was interested in what caught my attention and what took more effort to understand because the language and local conventions were unfamiliar. It made me notice things I might have overlooked at home.", "I did not work on campaigns for Japanese brands; these were personal observations during my stay. They reminded me that communication depends both on what we want to say and on the audience and context in which it will be understood."], ["A different way to approach something new.", "I took home the experience of building a life in a different environment: learning a language, working and getting to know people from another culture. Japan was a time when I had to be willing to learn, rather than understand everything already.", "I like trying things, adapting and learning from mistakes. Living there gave me real opportunities to practise that approach, at work and outside it.", "Today I continue learning through content and community management. I enjoy proposing ideas, developing them with the team and listening to different perspectives. The Fuji photograph closes this journey, but the experience continues to inform how I work."]];
const S = [
{ kanji: '到着', kana: 'とうちゃく', romaji: 'Tōchaku', es: 'Arrival', title: 'Arriving was only the beginning.',
text: 'Moving to Japan meant leaving the familiar behind and building a life somewhere else. I wanted to learn the language, work and get to know the people. Once there, I had to learn to manage day to day.',
photos: [{ src: '../img/japon-noche.jpg', ratio: '3 / 5', pos: '100% 50%', alt: 'Arnau on a street at night, carrying bags', cap: 'During my time in Japan.' }] },
{ kanji: '日本語', kana: 'にほんご', romaji: 'Nihongo', es: 'Language', title: 'Learning so I could belong.', genko: true,
text: 'Learning Japanese helped me manage at work, meet people and better understand what was happening around me. The language was part of the experience of living there and finding my place.',
hasQuote: true, quote: '“One of his most notable achievements is his rapid progress in Japanese, which has enabled him to communicate effectively with colleagues, suppliers, and guests, making him an increasingly valuable member of our team.”',
quoteNote: masia + '', photos: [] },
{ kanji: '銀座', kana: 'ぎんざ', romaji: 'Ginza', es: 'Work', title: 'Working was also learning the culture.',
text: 'At Masia, a Catalan restaurant in Ginza, I worked front of house while I kept learning Japanese. The job brought me closer to different expectations around customer service and attention to detail. Adapting also meant learning to communicate with colleagues and customers.',
noPhoto: true, photoPending: 'Masia · Ginza', masia: true,
hasQuote: true, quote: '“He quickly adapted to the demanding standards of fine dining and has shown continuous improvement and a strong willingness to learn.”',
quoteNote: masia + '', photos: [] },
{ kanji: '日常', kana: 'にちじょう', romaji: 'Nichijō', es: 'Day to day', title: 'From visiting a place to living in it.',
text: 'Getting around the city, working and spending time with Japanese people slowly turned a new place into my everyday life. Adapting to their customs also made me see my own differently.',
photos: [
{ src: '../img/japon-metro.jpg', ratio: '4 / 5', pos: '55% 50%', alt: 'Arnau in a subway car looking at his phone', cap: 'An everyday commute.' },
{ src: '../img/japon-rio-montanas.jpg', ratio: '4 / 5', pos: '50% 50%', alt: 'A river and mountains during my stay in Japan', cap: 'During my time in Japan.' }] },
{ kanji: '観察', kana: 'かんさつ', romaji: 'Kansatsu', es: 'Communication and brands', title: 'Seeing with new eyes.',
text: 'I also paid attention to the shops, the messages and the way people were served. My marketing background made me notice the differences from what I knew at home. It was a personal look at communication, outside the classroom.',
photos: [{ src: '../img/japon-bici-rio.jpg', ratio: '3 / 4', pos: '50% 50%', alt: 'Street full of illuminated shop and brand signs', cap: 'During my time in Japan.' }] },
{ kanji: '次へ', kana: 'つぎへ', romaji: 'Tsugi e', es: 'What I take with me', title: 'The journey continues in how I do things.',
text: 'I came back with the experience of having built a life in another environment and a language to keep learning. Also more confidence to face new situations and keep moving forward even when I don’t have everything figured out yet.', last: true,
photos: [{ src: '../img/viajes-fuji.jpg', ratio: '4 / 5', pos: '50% 60%', alt: 'Mount Fuji among the clouds, above a city', cap: 'Fuji, among the clouds.' }] }
];
const n = S.length;
const i = Math.max(0, Math.min(n - 1, this.state.i));
const moves = this.state.moves;
const go = (k) => () => { const t = Math.max(0, Math.min(n - 1, k)); if (t !== i) { this.remember(t); this.setState({ i: t, moves: moves + 1 }); } };
const stations = S.map((s, k) => ({ ...s, code: 'AR ' + String(k + 1).padStart(2, '0'), current: k === i ? 'step' : 'false', dot: k === i ? '#1E2B4F' : '#FFFFFF', labelColor: k === i ? '#1E2B4F' : '#555B66', aria: 'Stop ' + (k + 1) + ': ' + s.es + (k === i ? ' (current)' : ''), short: ['Arrival', 'Language', 'Work', 'Day to day', 'Brands', 'Takeaway'][k], pick: go(k) }));
const cur = { ...S[i], title: STORIES[i][0], paragraphs: STORIES[i].slice(1), num: String(i + 1).padStart(2, '0'), photos: S[i].photos || [], genko: !!S[i].genko, noPhoto: !!S[i].noPhoto, pendingText: !!S[i].pendingText, hasQuote: !!S[i].hasQuote, masia: !!S[i].masia, last: !!S[i].last };
const prev = S[i - 1], next = S[i + 1];
const genko = 'にほんごをまなぶまいにち'.split('').concat(['', '', '']).map((c) => ({ c }));
return {
stations, cur, genko,
even: moves > 0 && moves % 2 === 0, odd: moves % 2 === 1,
trainLeft: (n > 1 ? (i / (n - 1)) * 100 : 0) + '%',
goPrev: go(i - 1), goNext: go(i + 1), goFirst: go(0), notStart: i > 0,
atStart: i === 0, atEnd: i === n - 1, notEnd: i !== n - 1, curNumInt: i + 1,
prevOpacity: i === 0 ? 0.35 : 1, nextOpacity: i === n - 1 ? 0.35 : 1,
prevKanji: prev ? prev.kanji : '', prevRomaji: prev ? prev.romaji : 'Start',
nextKanji: next ? next.kanji : '', nextRomaji: next ? next.es : 'Continue · Work', nextEs: next ? next.es : 'Work',
prevAria: prev ? 'Previous stop: ' + prev.es : 'No previous stop',
nextAria: next ? 'Next stop: ' + next.es : 'No next stop'
};
}
}
window.Component = Component;
</script>
